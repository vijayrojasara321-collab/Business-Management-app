<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle / Android adaptive icon style -->
  <rect width="512" height="512" rx="128" fill="url(#grad1)"/>

  <!-- Subtle inner border ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>

  <!-- Decorative geometric accents -->
  <circle cx="420" cy="90" r="60" fill="url(#accent)" opacity="0.2" filter="blur(20px)"/>
  <circle cx="90" cy="420" r="80" fill="#38bdf8" opacity="0.15" filter="blur(30px)"/>

  <!-- Briefcase & Shield Icon Graphic -->
  <g filter="url(#shadow)" transform="translate(96, 96)">
    <!-- Main briefcase body -->
    <rect x="20" y="80" width="280" height="200" rx="32" fill="#ffffff" fill-opacity="0.95"/>
    
    <!-- Briefcase handle -->
    <path d="M110 80 V 50 C 110 33.43 123.43 20 140 20 H 180 C 196.57 20 210 33.43 210 50 V 80" 
          fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Accent band across briefcase -->
    <rect x="20" y="140" width="280" height="36" fill="#0284c7" opacity="0.15"/>
    
    <!-- Center clasp badge with star / check -->
    <circle cx="160" cy="158" r="28" fill="#2563eb"/>
    <path d="M150 158 L157 165 L172 150" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Growth chart line badge inside -->
    <path d="M60 230 L105 195 L145 215 L200 170 L260 200" 
          fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="260" cy="200" r="7" fill="#0284c7"/>
  </g>
</svg>
